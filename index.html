<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="FIMOSA ERP — Solusi ERP Terintegrasi untuk Manajemen Keuangan, Inventaris, dan Produksi yang Patuh PSAK & Perpajakan. Satu Sistem, Seluruh Bisnis Terkendali." />
  <meta name="keywords" content="ERP Indonesia, software akuntansi, manajemen inventaris, PSAK, perpajakan, FIMOSA" />
  <title>FIMOSA ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet" />

  <!-- Prevent theme flicker: apply saved theme or auto-detect OS theme before first paint -->
  <script>
    (function () {
      var saved = localStorage.getItem('fimosa-theme');
      var theme;
      if (saved) {
        theme = saved;
      } else {
        // Auto-detect OS theme preference
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
